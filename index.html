<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f9f78"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="PatiTakip">
<link rel="manifest" href="manifest.json"><title>PatiTakip</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24413b}
.app{max-width:430px;margin:auto;min-height:100vh;padding:18px 16px 95px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}
.brand{font-size:26px;font-weight:800}.muted{color:#78908a;font-size:13px}.pet,.card,.log{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 16px #214d4210}
.pet{display:flex;align-items:center;gap:12px}.petemoji{font-size:45px}.grow{flex:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.value{font-size:25px;font-weight:800;margin:5px 0}.bar{height:8px;background:#e7eee9;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#2f9f78}
.section{margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
button{border:0;border-radius:15px;padding:12px 15px;font-weight:700;font-size:14px}.primary{background:#2f9f78;color:white;width:100%}.small{background:#e5f2ec;color:#21755b}
.log{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.empty{text-align:center;color:#78908a;padding:20px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e7ece9;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{background:transparent;color:#718781}.active{color:#2f9f78!important}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:10}.sheet{background:#fbfaf7;width:100%;max-width:430px;margin:auto;border-radius:25px 25px 0 0;padding:20px 16px 30px}
input,select{width:100%;padding:14px;border:1px solid #dce6e1;border-radius:14px;margin:7px 0 14px;background:white;font-size:16px}
label{font-size:13px;color:#5d756e}.close{float:right;background:#e8eee9}.hero{background:linear-gradient(135deg,#e7f5ee,#fff7ec);border-radius:23px;padding:18px;margin-bottom:14px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#24413b;color:white;padding:11px 15px;border-radius:14px;display:none;z-index:20}
</style></head>
<body>
<div class="app">
<div class="top"><div><div class="brand">🐾 PatiTakip</div><div class="muted">Minik dostunun günlük takibi</div></div><button class="small" onclick="openReminders()">🔔 <span id="rc">0</span></button></div>
<div class="hero"><b>Bugün nasılsınız? 🐾</b><div class="muted" style="margin-top:6px">Mama, su ve sağlık kayıtlarını tek yerden takip et.</div></div>
<div class="pet"><div class="petemoji" id="emoji">🐶</div><div class="grow"><b id="name">Luna</b><div class="muted"><span id="weight">12.5</span> kg</div></div><button class="small" onclick="openProfile()">Düzenle</button></div>
<div class="stats"><div class="card"><div class="muted">🍗 Bugünkü mama</div><div class="value"><span id="food">0</span> g</div><div class="bar"><i id="fb"></i></div><div class="muted">Hedef: <span id="goal">200</span> g</div></div>
<div class="card"><div class="muted">💧 Bugünkü su</div><div class="value"><span id="water">0</span> ml</div><div class="bar"><i id="wb"></i></div><div class="muted">Hedef: 600 ml</div></div></div>
<div class="section"><div class="sectionhead"><h3>Bugünkü mama</h3><button class="small" onclick="openFood()">+ Mama</button></div><div id="list"></div></div>
<div class="section" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="card" onclick="openFood()">🍗<br><b>Mama ekle</b><br><span class="muted">gram kaydet</span></button><button class="card" onclick="addWater()">💧<br><b>100 ml su</b><br><span class="muted">hızlı kayıt</span></button></div>
</div>
<nav><button class="active">🏠<br>Ana Sayfa</button><button onclick="openReminders()">🔔<br>Bildirim</button><button onclick="openStats()">📊<br>İstatistik</button><button onclick="openProfile()">🐾<br>Profil</button></nav>

<div class="modal" id="foodModal"><div class="sheet"><button class="close" onclick="closeM('foodModal')">✕</button><h2>🍗 Mama Ekle</h2><label>Miktar (gram)</label><input id="grams" type="number" min="1" placeholder="50"><label>Öğün</label><select id="meal"><option>Kahvaltı</option><option>Öğle</option><option>Akşam</option><option>Ara Öğün</option></select><button class="primary" onclick="saveFood()">Kaydet</button></div></div>
<div class="modal" id="profileModal"><div class="sheet"><button class="close" onclick="closeM('profileModal')">✕</button><h2>🐾 Profil</h2><label>İsim</label><input id="pname"><label>Tür</label><select id="ptype"><option value="dog">🐶 Köpek</option><option value="cat">🐱 Kedi</option></select><label>Kilo (kg)</label><input id="pweight" type="number" step=".1"><label>Günlük mama hedefi (g)</label><input id="pgoal" type="number"><button class="primary" onclick="saveProfile()">Kaydet</button></div></div>
<div class="modal" id="genericModal"><div class="sheet"><button class="close" onclick="closeM('genericModal')">✕</button><div id="generic"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const K='patitakip_pwa';let d=JSON.parse(localStorage.getItem(K)||'null')||{pet:{name:'Luna',type:'dog',weight:12.5,goal:200},logs:[],reminders:[]};
const save=()=>{localStorage.setItem(K,JSON.stringify(d));render()};const today=()=>new Date().toLocaleDateString('tr-TR');
function totals(){let a=d.logs.filter(x=>x.date===today());return {f:a.filter(x=>x.kind==='food').reduce((s,x)=>s+x.amount,0),w:a.filter(x=>x.kind==='water').reduce((s,x)=>s+x.amount,0)}}
function render(){document.getElementById('name').textContent=d.pet.name;document.getElementById('emoji').textContent=d.pet.type==='cat'?'🐱':'🐶';document.getElementById('weight').textContent=d.pet.weight;document.getElementById('goal').textContent=d.pet.goal;let t=totals();document.getElementById('food').textContent=t.f;document.getElementById('water').textContent=t.w;document.getElementById('fb').style.width=Math.min(100,t.f/d.pet.goal*100)+'%';document.getElementById('wb').style.width=Math.min(100,t.w/600*100)+'%';document.getElementById('rc').textContent=d.reminders.filter(x=>x.enabled).length;let a=d.logs.filter(x=>x.date===today()&&x.kind==='food').slice().reverse();document.getElementById('list').innerHTML=a.length?a.map(x=>`<div class="log"><span><b>🍗 ${x.meal}</b><br><span class="muted">${x.time}</span></span><b>${x.amount} g</b></div>`).join(''):'<div class="empty">Henüz mama kaydı yok. 🐾</div>'}
function openFood(){document.getElementById('foodModal').style.display='flex'}function openProfile(){pname.value=d.pet.name;ptype.value=d.pet.type;pweight.value=d.pet.weight;pgoal.value=d.pet.goal;profileModal.style.display='flex'}
function saveFood(){let n=Number(grams.value);if(!n)return;let now=new Date();d.logs.push({kind:'food',amount:n,meal:meal.value,date:today(),time:now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})});grams.value='';closeM('foodModal');save();toast('Mama kaydedildi 🐾')}
function addWater(){let now=new Date();d.logs.push({kind:'water',amount:100,date:today(),time:now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});save();toast('100 ml su kaydedildi 💧')}
function saveProfile(){d.pet.name=pname.value||'Minik';d.pet.type=ptype.value;d.pet.weight=Number(pweight.value)||0;d.pet.goal=Number(pgoal.value)||200;closeM('profileModal');save();toast('Profil güncellendi')}
function closeM(id){document.getElementById(id).style.display='none'}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}
function openReminders(){let c=document.getElementById('generic');c.innerHTML='<h2>🔔 Bildirimler</h2><p class="muted">Hatırlatıcılarını yönet.</p>'+(d.reminders.length?d.reminders.map((r,i)=>`<div class="log"><span><b>${r.title}</b><br><span class="muted">${r.time}</span></span><button class="small" onclick="delR(${i})">Sil</button></div>`).join(''):'<div class="empty">Henüz hatırlatıcı yok.</div>')+'<button class="primary" onclick="addR()">+ Yeni hatırlatıcı</button><p class="muted" style="margin-top:12px">Not: Safari/PWA içinde uygulama içi hatırlatıcı kayıtları tutulur. Gerçek zamanlı sistem bildirimleri için native iOS sürümü gerekir.</p>';genericModal.style.display='flex'}
function addR(){let title=prompt('Hatırlatıcı adı:');if(!title)return;let time=prompt('Saat (SS:DD):','09:00')||'09:00';d.reminders.push({title,time,enabled:true});save();openReminders()}
function delR(i){d.reminders.splice(i,1);save();openReminders()}
function openStats(){let t=totals();document.getElementById('generic').innerHTML=`<h2>📊 Bugünün Özeti</h2><div class="card" style="margin-top:12px"><div class="value">${t.f} g</div><div class="muted">Mama</div></div><div class="card" style="margin-top:12px"><div class="value">${t.w} ml</div><div class="muted">Su</div></div><div class="card" style="margin-top:12px"><div class="value">${d.pet.weight} kg</div><div class="muted">Kilo</div></div>`;genericModal.style.display='flex'}
render();
</script></body></html>
